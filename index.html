        function renderEverything() {
            const searchInput = document.getElementById('mainSearch');
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : "";

            // RENDER VITABU
            const bGrid = document.getElementById('booksGrid');
            if (bGrid) {
                const filtered = books.filter(b => {
                    const matchesSearch = b.t.toLowerCase().includes(searchTerm);
                    const matchesCat = (currentCategory === 'all' || b.c.toLowerCase() === currentCategory);
                    return matchesSearch && matchesCat;
                });

                bGrid.innerHTML = filtered.map(b => `
                <div class="book-card glass p-6 rounded-[2.5rem] bg-slate-900/40 border border-white/5 transition hover:border-cyan-500/50 shadow-lg">
                    <span class="text-[9px] text-cyan-500 font-black uppercase tracking-widest">${b.c}</span>
                    <h3 class="text-white font-bold mt-2 mb-4 text-sm leading-tight h-10 overflow-hidden">${b.t}</h3>
                    <a href="${b.l}" target="_blank" class="block w-full bg-cyan-500 text-black py-3 rounded-xl text-center text-[10px] font-black uppercase hover:bg-white transition">Soma</a>
                </div>
            `).join('');
            }

            // RENDER VIDEO
            const vGrid = document.getElementById('videoGrid');
            if (vGrid) {
                const filteredV = studyVideos.filter(v => v.t.toLowerCase().includes(searchTerm));

                <div class="video-card glass p-4 rounded-[2.5rem] bg-slate-900/40 border border-white/5 transition hover:border-cyan-500/50">
                    <div class="relative cursor-pointer overflow-hidden rounded-2xl group" onclick="window.open('${v.link}', '_blank')">

                        </div>
                    </div>
                    <h3 class="text-white text-xs font-bold mt-4 px-2 h-10 overflow-hidden">${v.t}</h3>
                </div>
            `).join('');
            }
        }
